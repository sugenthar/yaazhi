name: Deploy Yaazhi Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate website source
        run: |
          test -f website/index.html || (echo "ERROR: website/index.html not found — publishing directory must be ./website" && exit 1)
          echo "website/index.html verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Attempt to enable the Pages site automatically if the
          # repository has never had Pages enabled. If the token lacks
          # permission, enable it manually via Settings → Pages → Source.
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
